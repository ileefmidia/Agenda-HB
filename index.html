<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda da Equipe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e4e2da;--ac:#2f6f5e;--on:#fff;--hi:#e3f0eb;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161715;--card:#20211f;--tx:#eeeee8;--mut:#a0a09a;--bd:#34352f;--ac:#5fb59d;--on:#0f1a16;--hi:#233029;--er:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.hide{display:none!important}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar b{font-size:18px;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.d{min-height:58px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;border-radius:8px}
.d.o{opacity:.4}.d.t{border-color:var(--ac)}.d.s{background:var(--hi);border-color:var(--ac)}
.d .n{font-size:13px}
.c{font-size:11px;background:var(--ac);color:var(--on);border-radius:99px;padding:0 7px;align-self:flex-start}
.panel,.box{margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.box{max-width:380px;margin:8vh auto 0}
.box h1{margin-bottom:12px}
.box input{display:block;width:100%;margin-bottom:8px}
.panel h2{font-size:16px;margin:0 0 10px;text-transform:capitalize}
details{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;padding:0 10px}
summary{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .nm{flex:1;font-weight:600}
.ev{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
input{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
#t{flex:2 1 180px}#h{flex:0 0 110px}
.msg{color:var(--mut);font-size:13px;margin-top:8px}
.err{color:var(--er);font-size:14px;margin-top:8px}
@media(max-width:520px){.d{min-height:48px;padding:4px}}
</style>
</head>
<body>
<main>

<div class="box hide" id="cfg">
  <h1>Falta configurar</h1>
  <p>Abra este arquivo em um editor de texto e preencha <b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b> no começo do script, conforme o passo a passo.</p>
</div>

<div class="box hide" id="login">
  <h1>📅 Agenda da Equipe</h1>
  <input id="em" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pw" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password">
  <div class="row" style="margin-top:0">
    <button class="p" id="in">Entrar</button>
    <button id="up">Criar conta</button>
  </div>
  <div class="err" id="le"></div>
</div>

<div class="box hide" id="nome">
  <h1>Como você quer aparecer?</h1>
  <input id="nm" placeholder="Seu nome" maxlength="60">
  <button class="p" id="sv">Salvar nome</button>
  <div class="err" id="ne"></div>
</div>

<div class="hide" id="app">
  <div class="top">
    <h1>📅 Agenda da Equipe</h1>
    <div class="me"><span class="av" id="mav"></span><span id="mnm"></span><button id="out">Sair</button></div>
  </div>
  <div class="bar">
    <button id="pv" aria-label="Mês anterior">←</button>
    <b id="mt"></b>
    <button id="nx" aria-label="Próximo mês">→</button>
  </div>
  <div class="grid" id="g"></div>
  <div class="panel">
    <h2 id="dt"></h2>
    <div id="ls"></div>
    <div class="row">
      <input id="t" placeholder="Meu compromisso" maxlength="120">
      <input id="h" type="time">
      <button class="p" id="add">Adicionar</button>
    </div>
    <div class="err" id="er"></div>
  </div>
</div>

</main>
<script>
/* ====== PREENCHA AQUI (Supabase > Project Settings > API) ====== */
var SUPABASE_URL = 'https://uudaqsureqysqfpmuqgn.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1ZGFxc3VyZXF5c3FmcG11cWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTkxMjksImV4cCI6MjEwNjE5NTEyOX0.k8j7egSxC1f86kqGn40H0_2egpP9X5YjHt6UpMbjcYQ';
/* =============================================================== */

var $=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var today=new Date(), Y=today.getFullYear(), M=today.getMonth(), sel=iso(today);
var sb, user=null, profiles={}, events=[], opened={}, channel=null, startedFor=null;

function show(id){['cfg','login','nome','app'].forEach(function(x){$(x).classList.toggle('hide',x!==id)})}
function cor(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'hsl('+h+',45%,38%)'}
function avatar(el,uid,nome){el.textContent=(nome||'?').trim().charAt(0).toUpperCase();el.style.background=cor(uid||'x')}
function nomeDe(uid){return (profiles[uid]&&profiles[uid].name)||'Alguém'}
function ptErr(e){
  var m=(e&&e.message)||'Erro inesperado.';
  if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use Entrar.';
  if(/password/i.test(m)&&/6/.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/signups not allowed/i.test(m))return 'Novos cadastros estão desativados. Peça ao administrador para criar seu acesso.';
  if(/email not confirmed/i.test(m))return 'Confirme seu e-mail pelo link enviado e tente de novo.';
  return m;
}

function gridStart(){return new Date(Y,M,1-new Date(Y,M,1).getDay())}
function calendar(){
  $('mt').textContent=MESES[M]+' '+Y;
  var g=$('g'); g.innerHTML='';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(function(w){
    var e=document.createElement('div');e.className='wd';e.textContent=w;g.appendChild(e);
  });
  var st=gridStart(), ti=iso(today);
  for(var i=0;i<42;i++){
    var d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i), k=iso(d);
    var b=document.createElement('button');
    b.className='d'+(d.getMonth()!==M?' o':'')+(k===ti?' t':'')+(k===sel?' s':'');
    var n=document.createElement('span');n.className='n';n.textContent=d.getDate();b.appendChild(n);
    var q=events.filter(function(e){return e.date===k}).length;
    if(q){var c=document.createElement('span');c.className='c';c.textContent=q;b.appendChild(c)}
    b.onclick=(function(k){return function(){sel=k;render()}})(k);
    g.appendChild(b);
  }
}
function panel(){
  var p=sel.split('-');
  $('dt').textContent=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  var groups={};
  events.filter(function(e){return e.date===sel}).forEach(function(e){(groups[e.user_id]=groups[e.user_id]||[]).push(e)});
  var keys=Object.keys(groups).sort(function(a,b){
    if(a===user.id)return -1; if(b===user.id)return 1; return nomeDe(a).localeCompare(nomeDe(b));
  });
  var ls=$('ls'); ls.innerHTML='';
  if(!keys.length){var m=document.createElement('div');m.className='msg';m.textContent='Nada marcado para este dia.';ls.appendChild(m)}
  keys.forEach(function(k){
    var dt=document.createElement('details'), sm=document.createElement('summary'), key=sel+'|'+k;
    dt.open=!!opened[key]; dt.ontoggle=function(){opened[key]=dt.open};
    var av=document.createElement('span');av.className='av';avatar(av,k,nomeDe(k));sm.appendChild(av);
    var nm=document.createElement('span');nm.className='nm';nm.textContent=nomeDe(k)+(k===user.id?' (você)':'');sm.appendChild(nm);
    var c=document.createElement('span');c.className='c';c.textContent=groups[k].length;sm.appendChild(c);
    dt.appendChild(sm);
    groups[k].sort(function(a,b){return (a.time||'99').localeCompare(b.time||'99')}).forEach(function(e){
      var r=document.createElement('div');r.className='ev';
      var l=document.createElement('div');l.textContent=(e.time?e.time.slice(0,5)+' · ':'')+e.title;r.appendChild(l);
      if(e.user_id===user.id){var x=document.createElement('button');x.textContent='Excluir';x.onclick=function(){remover(e.id)};r.appendChild(x)}
      dt.appendChild(r);
    });
    ls.appendChild(dt);
  });
}
function render(){calendar();panel()}

async function carregar(){
  var st=gridStart(), fim=new Date(st.getFullYear(),st.getMonth(),st.getDate()+41);
  var r=await Promise.all([
    sb.from('events').select('*').gte('date',iso(st)).lte('date',iso(fim)),
    sb.from('profiles').select('*')
  ]);
  if(r[0].error){$('er').textContent=ptErr(r[0].error);return}
  events=r[0].data||[];
  profiles={};(r[1].data||[]).forEach(function(p){profiles[p.id]=p});
  render();
}
async function adicionar(){
  var title=$('t').value.trim();
  if(!title){$('er').textContent='Escreva o nome do compromisso.';return}
  $('er').textContent='';
  var r=await sb.from('events').insert({title:title,date:sel,time:$('h').value||null});
  if(r.error){$('er').textContent=ptErr(r.error);return}
  $('t').value='';$('h').value='';opened[sel+'|'+user.id]=true;carregar();
}
async function remover(id){
  var r=await sb.from('events').delete().eq('id',id);
  if(r.error){$('er').textContent=ptErr(r.error);return}
  carregar();
}

async function iniciar(session){
  if(!session){
    user=null;startedFor=null;
    if(channel){sb.removeChannel(channel);channel=null}
    show('login');return;
  }
  if(startedFor===session.user.id)return;
  startedFor=session.user.id;user=session.user;
  var r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!r.data){show('nome');return}
  entrar(r.data.name);
}
function entrar(nome){
  $('mnm').textContent=nome;avatar($('mav'),user.id,nome);
  show('app');carregar();
  if(!channel){
    channel=sb.channel('agenda').on('postgres_changes',{event:'*',schema:'public',table:'events'},carregar)
      .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},carregar).subscribe();
  }
}
async function autenticar(criar){
  $('le').textContent='';
  var c={email:$('em').value.trim(),password:$('pw').value};
  if(!c.email||!c.password){$('le').textContent='Preencha e-mail e senha.';return}
  var r=criar?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error){$('le').textContent=ptErr(r.error);return}
  if(criar&&!r.data.session){$('le').textContent='Conta criada. Confirme o e-mail pelo link enviado e depois use Entrar.'}
}

$('in').onclick=function(){autenticar(false)};
$('up').onclick=function(){autenticar(true)};
$('pw').onkeydown=function(e){if(e.key==='Enter')autenticar(false)};
$('out').onclick=function(){sb.auth.signOut()};
$('add').onclick=adicionar;
$('t').onkeydown=function(e){if(e.key==='Enter')adicionar()};
$('pv').onclick=function(){M--;if(M<0){M=11;Y--}carregar()};
$('nx').onclick=function(){M++;if(M>11){M=0;Y++}carregar()};
$('sv').onclick=async function(){
  var n=$('nm').value.trim();
  if(!n){$('ne').textContent='Escreva seu nome.';return}
  var r=await sb.from('profiles').upsert({id:user.id,name:n});
  if(r.error){$('ne').textContent=ptErr(r.error);return}
  entrar(n);
};

if(SUPABASE_URL.indexOf('COLE_AQUI')===0||!window.supabase){show('cfg')}
else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){iniciar(session)},0)});
  sb.auth.getSession().then(function(r){iniciar(r.data.session)});
}
</script>
</body>
</html>
